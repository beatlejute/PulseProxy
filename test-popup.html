<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=280, initial-scale=1.0, minimum-scale=1.0">
    <title>Proxy Manager [TEST]</title>
    <link rel="stylesheet" href="style.css">
    <script>
    // Mock Chrome API
    const _storage = {
        local: {
            proxyState: 'disconnected',
            language: 'en',
            syncEnabled: false,
            proxyCheckEnabled: true,
            proxyByDefault: false,
            theme: 'light',
            proxies: [],
            activeProxyId: null,
            presets: []
        },
        sync: {
            syncEnabled: false
        }
    };

    window._testStorage = _storage;

    window.chrome = {
        runtime: {
            getManifest: () => ({ version: '1.0.0-test' }),
            onMessage: { addListener: () => {} },
            sendMessage: (msg, cb) => { if(cb) cb({}); },
            id: 'test-extension-id',
            lastError: null
        },
        storage: {
            local: {
                get: (keys, cb) => {
                    const resolve = (result) => {
                        if (typeof cb === 'function') setTimeout(() => cb(result), 0);
                        return Promise.resolve(result);
                    };
                    if (typeof keys === 'string') {
                        const result = {};
                        result[keys] = _storage.local[keys];
                        return resolve(result);
                    } else if (Array.isArray(keys)) {
                        const result = {};
                        keys.forEach(k => result[k] = _storage.local[k]);
                        return resolve(result);
                    } else if (keys === null || keys === undefined) {
                        return resolve({..._storage.local});
                    } else {
                        const result = {};
                        Object.keys(keys).forEach(k => result[k] = _storage.local[k] !== undefined ? _storage.local[k] : keys[k]);
                        return resolve(result);
                    }
                },
                set: (data, cb) => {
                    Object.assign(_storage.local, data);
                    console.log('[STORAGE.LOCAL.SET]', JSON.stringify(data));
                    if (typeof cb === 'function') setTimeout(() => cb(), 0);
                    return Promise.resolve();
                },
                remove: (keys, cb) => {
                    if (typeof keys === 'string') delete _storage.local[keys];
                    else keys.forEach(k => delete _storage.local[k]);
                    if (typeof cb === 'function') setTimeout(() => cb(), 0);
                    return Promise.resolve();
                }
            },
            sync: {
                get: (keys, cb) => {
                    const resolve = (result) => {
                        if (typeof cb === 'function') setTimeout(() => cb(result), 0);
                        return Promise.resolve(result);
                    };
                    if (typeof keys === 'string') {
                        const result = {};
                        result[keys] = _storage.sync[keys];
                        return resolve(result);
                    } else if (Array.isArray(keys)) {
                        const result = {};
                        keys.forEach(k => result[k] = _storage.sync[k]);
                        return resolve(result);
                    } else if (keys === null || keys === undefined) {
                        return resolve({..._storage.sync});
                    } else {
                        const result = {};
                        Object.keys(keys).forEach(k => result[k] = _storage.sync[k] !== undefined ? _storage.sync[k] : keys[k]);
                        return resolve(result);
                    }
                },
                set: (data, cb) => {
                    Object.assign(_storage.sync, data);
                    console.log('[STORAGE.SYNC.SET]', JSON.stringify(data));
                    if (typeof cb === 'function') setTimeout(() => cb(), 0);
                    return Promise.resolve();
                },
                remove: (keys, cb) => {
                    if (typeof keys === 'string') delete _storage.sync[keys];
                    else keys.forEach(k => delete _storage.sync[k]);
                    if (typeof cb === 'function') setTimeout(() => cb(), 0);
                    return Promise.resolve();
                }
            },
            onChanged: {
                addListener: (cb) => {}
            }
        },
        proxy: {
            settings: {
                set: (config, cb) => {
                    console.log('[PROXY.SETTINGS.SET]', JSON.stringify(config));
                    window._lastProxySettings = config;
                    setTimeout(() => cb && cb(), 0);
                },
                clear: (details, cb) => {
                    console.log('[PROXY.SETTINGS.CLEAR]');
                    window._lastProxySettings = null;
                    setTimeout(() => cb && cb(), 0);
                },
                get: (details, cb) => {
                    setTimeout(() => cb && cb({ value: window._lastProxySettings || { mode: 'direct' } }), 0);
                }
            }
        },
        tabs: {
            create: (opts) => { console.log('[TABS.CREATE]', opts.url); }
        },
        action: {
            setIcon: (opts, cb) => { console.log('[ACTION.SETICON]', opts.path); if(cb) cb(); },
            setBadgeText: (opts, cb) => { if(cb) cb(); },
            setBadgeBackgroundColor: (opts, cb) => { if(cb) cb(); }
        }
    };

    // Helper to dump storage state
    window.getStorageState = () => ({ local: {..._storage.local}, sync: {..._storage.sync} });
    </script>
</head>
<body>
    <div class="container">
        <button id="main-button" class="main-button disconnected">
            <svg class="shield-icon" viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
                <path class="shield-bg" d="M50 0 L95 15 L95 55 C95 85 50 115 50 115 C50 115 5 85 5 55 L5 15 Z"/>
                <g class="pulse-container">
                    <clipPath id="pulse-clip">
                        <rect x="20" y="30" width="60" height="60"/>
                    </clipPath>
                    <g clip-path="url(#pulse-clip)">
                        <path class="pulse-line" d="M20 60 L35 60 L42 40 L50 80 L58 40 L65 60 L80 60 L95 60 L102 40 L110 80 L118 40 L125 60 L140 60"/>
                    </g>
                </g>
                <line class="flat-line" x1="20" y1="60" x2="80" y2="60"/>
                <g class="checkmark-badge">
                    <circle cx="75" cy="95" r="12" class="badge-circle"/>
                    <path class="checkmark" d="M69 95 L73 99 L81 91" />
                </g>
            </svg>
        </button>

        <div id="error-banner" class="public-proxies-warning" style="display:none;">
            <span class="warning-icon">⚠️</span>
            <div class="warning-content">
                <span class="warning-title" data-i18n="proxyErrorTitle">Connection failed</span> <span id="error-proxy-label" class="error-proxy-label"></span>
                <span class="warning-recommendation" data-i18n="publicProxiesWarning">Public proxies may be slow, unstable, and insecure. Use at your own risk.</span>
                <span class="warning-recommendation"><span data-i18n="publicProxiesRecommendation">We recommend buying reliable and affordable proxies</span> <a href="#" target="_blank" class="referral-link" data-i18n="promoLink">Buy proxies</a></span>
            </div>
        </div>

        <div id="segmented-control" class="segmented-control">
            <button class="segment" data-tab="proxy" data-i18n="tabProxy">Proxy</button>
            <button class="segment" data-tab="presets" data-i18n="tabPresets">Presets</button>
            <button class="segment" data-tab="settings" data-i18n="tabSettings">Settings</button>
        </div>

        <div class="tab-contents">
            <div id="tab-proxy" class="tab-content">
                <div id="proxy-list-container"></div>
            </div>

            <div id="tab-presets" class="tab-content">
                <div class="setting-group presets-section">
                    <button id="proxy-by-default-toggle" class="proxy-by-default-toggle" data-i18n="labelProxyByDefault">Proxy all sites by default</button>
                    <button id="add-preset-button" class="add-preset-button" data-i18n="buttonAddPreset">+ Add Preset</button>
                    <div id="presets-container">
                        <div id="presets-list"></div>
                    </div>
                </div>
            </div>

            <div id="tab-settings" class="tab-content">
                <div class="setting-group language-selector">
                    <label for="language-select" data-i18n="labelLanguage">Language:</label>
                    <select id="language-select"></select>
                </div>

                <div class="setting-group sync-toggle">
                    <input type="checkbox" id="sync-toggle" />
                    <label for="sync-toggle" data-i18n="labelSync">Sync settings</label>
                </div>

                <div class="setting-group proxy-check-toggle">
                    <input type="checkbox" id="proxy-check-toggle" />
                    <label for="proxy-check-toggle" data-i18n="labelProxyCheck">Check proxy before adding</label>
                </div>

                <div class="setting-group import-export-section">
                    <div class="setting-label" data-i18n="labelImportExport">Import/Export</div>
                    <div class="import-export-buttons">
                        <button id="export-button" class="secondary-button" data-i18n="buttonExport">Export Settings</button>
                        <button id="import-button" class="secondary-button" data-i18n="buttonImport">Import Settings</button>
                    </div>
                    <input type="file" id="import-file-input" accept=".json" style="display: none;" />
                </div>

                <div class="setting-group version-info">
                    <span data-i18n="labelVersion">Version:</span> <span id="version-number"></span>
                </div>
            </div>
        </div>
        <a href="#" target="_blank" class="promo-link referral-link" data-i18n="promoLink">Buy proxies</a>
    </div>
    <script type="module" src="dist/popup.js"></script>
</body>
</html>
